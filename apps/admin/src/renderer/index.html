<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expertmotion License Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">Expertmotion <span>License Admin</span></div>
    <nav id="tabs" class="tabs" aria-label="Screens">
      <button data-tab="keys" class="active">Keys</button>
      <button data-tab="issue">Issue</button>
      <button data-tab="licences">Licences</button>
      <button data-tab="verify">Verify</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div id="keystatus" class="keystatus" aria-live="polite"></div>
  </header>
  <div id="netbanner" class="banner hidden" role="alert"></div>
  <main id="screen"></main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
